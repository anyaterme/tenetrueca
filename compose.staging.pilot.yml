# Future operator-only CLI. Requires a separate explicit authorization; never run in this task.
# Merge ONLY with compose.staging.yml, never with the ephemeral validation override.
services:
  evaluator:
    extends:
      file: compose.staging.yml
      service: app
    profiles: [authorized-pilot]
    ports: !reset []
    healthcheck: {disable: true}
    restart: "no"
    environment:
      TRUECA_STAGING_PILOT_AUTHORIZED: explicit-operator-authorization
      CHATBOT_PROVIDER: openai
      CHATBOT_OPENAI_MODEL: ${TRUECA_PILOT_MODEL:-gpt-6-luna}
      CHATBOT_EVAL_ALLOW_LIVE: "True"
      CHATBOT_EVAL_AUTHORIZATION_ID: ${TRUECA_PILOT_AUTHORIZATION_ID:?Use the SAME explicitly approved UUID}
      CHATBOT_EVAL_CASE_IDS: ${TRUECA_PILOT_CASE_IDS:-}
      CHATBOT_EVAL_MAX_REQUESTS: ${TRUECA_PILOT_MAX_REQUESTS:-20}
      CHATBOT_EVAL_MAX_BUDGET_USD: ${TRUECA_PILOT_MAX_BUDGET_USD:-1.00}
      CHATBOT_EVAL_PROJECT_REF: ${TRUECA_PILOT_PROJECT_REF:?Provide an explicitly authorized OpenAI project}
      CHATBOT_EVAL_PRICING_FILE: /run/secrets/approved_evaluation_prices
    secrets: [django_secret_key, postgres_password, openai_evaluation_key, approved_evaluation_prices]
    networks: [staging_private, evaluation_egress]
    command: [python, manage.py, evaluate_chatbot_live, --dry-run, --dataset, pilot-v1, --mode, both,
              --max-requests, "20", --max-budget-usd, "1.00", --max-input-tokens, "1050000", --max-output-tokens, "400"]
networks:
  evaluation_egress:
    internal: false
secrets:
  openai_evaluation_key:
    file: ${TRUECA_PILOT_API_KEY_FILE:?Provide an authorized server secret file}
  approved_evaluation_prices:
    file: ${TRUECA_PILOT_PRICING_FILE:?Provide manually verified approved pricing}
