{% if href %}
  <a class="button button--{{ variant|default:'primary' }}{% if block == True %} button--block{% endif %}{% if extra_class %} {{ extra_class }}{% endif %}" href="{{ href }}">
    {% if leading_icon %}<span class="button__icon" aria-hidden="true">{{ leading_icon }}</span>{% endif %}
    <span>{{ label }}</span>
    {% if trailing_icon %}<span class="button__icon" aria-hidden="true">{{ trailing_icon }}</span>{% endif %}
  </a>
{% else %}
  <button class="button button--{{ variant|default:'primary' }}{% if block == True %} button--block{% endif %}{% if extra_class %} {{ extra_class }}{% endif %}" type="{{ button_type|default:'button' }}">
    {% if leading_icon %}<span class="button__icon" aria-hidden="true">{{ leading_icon }}</span>{% endif %}
    <span>{{ label }}</span>
    {% if trailing_icon %}<span class="button__icon" aria-hidden="true">{{ trailing_icon }}</span>{% endif %}
  </button>
{% endif %}
