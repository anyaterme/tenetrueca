<div class="configuration-field{% if field.errors %} configuration-field--error{% endif %}" data-configuration-field>
  <div class="configuration-field__heading">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    <span class="configuration-source configuration-source--{{ source }}">{% if source == 'database' %}Backoffice{% else %}Servidor{% endif %}</span>
  </div>
  <label class="configuration-override" for="{{ toggle.id_for_label }}">
    {{ toggle }}
    <span>Personalizar</span>
  </label>
  <div class="configuration-field__control">{{ field }}{% if suffix %}<span class="configuration-field__suffix">{{ suffix }}</span>{% endif %}</div>
  {% if help_text %}<p class="configuration-field__help">{{ help_text }}</p>{% endif %}
  {% if field.errors %}<ul class="form-field__errors" id="{{ field.id_for_label }}-errors" role="alert">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
</div>
